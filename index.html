<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Sign in</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; }
  body {
    min-height: 100dvh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px 24px calc(108px + env(safe-area-inset-bottom));
  }
  #code {
    margin: 0;
    font-size: clamp(56px, 16vw, 104px);
    font-weight: 700;
    letter-spacing: 0.14em;
    font-variant-numeric: tabular-nums;
    user-select: all;
  }
  .err {
    display: none;
    position: fixed;
    left: 20px;
    right: 20px;
    bottom: calc(84px + env(safe-area-inset-bottom));
    margin: 0;
    text-align: center;
    color: #ff8a80;
    font-size: 14px;
  }
  button {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: calc(16px + env(safe-area-inset-bottom));
    height: 52px;
    border: 0;
    border-radius: 14px;
    background: #E4C04A;
    color: #14120A;
    font: 700 17px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  button:disabled { opacity: 0.4; }
</style>
</head>
<body>
<main><h1 id="code"></h1></main>
<p class="err" id="err"></p>
<button type="button" id="copy" disabled>Copy</button>
<script>
(function () {
  var node = document.getElementById("code");
  var button = document.getElementById("copy");
  var err = document.getElementById("err");
  var code = (new URLSearchParams(location.search).get("code") || "").replace(/\D/g, "").slice(0, 6);
  if (!code) {
    var pathCode = (location.pathname.match(/(\d{6})(?!.*\d)/) || [])[1] || "";
    code = pathCode;
  }
  var hash = new URLSearchParams(location.hash.slice(1));
  var access = hash.get("access_token") || "";
  var refresh = hash.get("refresh_token") || "";
  if (!code && access && refresh) {
    code = String(Math.floor(100000 + Math.random() * 900000));
  }
  node.textContent = code;
  if (code) document.title = code;

  function fail(message) {
    err.textContent = message;
    err.style.display = "block";
  }

  function enable() {
    if (!code) {
      fail("Open the link from the email.");
      return;
    }
    button.disabled = false;
  }

  button.addEventListener("click", function () {
    var done = function () { button.textContent = "Copied"; };
    function fallback() {
      var input = document.createElement("textarea");
      input.value = code;
      input.setAttribute("readonly", "");
      input.style.position = "fixed";
      input.style.left = "-9999px";
      document.body.appendChild(input);
      input.select();
      try { document.execCommand("copy"); } catch (e) {}
      input.remove();
      done();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(done).catch(fallback);
      return;
    }
    fallback();
  });

  if (!code || !access || !refresh) {
    enable();
    return;
  }

  fetch("https://sfisdbknqvjlgqgxaocf.supabase.co/functions/v1/copy-code", {
    method: "POST",
    headers: { "content-type": "text/plain;charset=UTF-8" },
    body: JSON.stringify({ code: code, access_token: access, refresh_token: refresh })
  }).then(function (res) {
    return res.json().then(function (body) {
      if (!res.ok) throw new Error((body && body.error) || "Could not save this code.");
      history.replaceState(null, "", location.pathname + "?code=" + code);
      enable();
    });
  }).catch(function () {
    fail("Could not save this code. Resend it from the app.");
  });
})();
</script>
</body>
</html>
